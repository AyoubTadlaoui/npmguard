name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Both macOS targets build on macos-14 (Apple Silicon) — the runner
          # ships the universal SDK so cargo cross-compiles x86_64 cleanly,
          # avoiding the macos-13 Intel-runner queue.
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: install rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross-compiler (linux arm64)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: build
        shell: bash
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: compute archive name
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          name="npmguard-${version}-${{ matrix.target }}"
          echo "archive_name=${name}" >> "$GITHUB_OUTPUT"

      - name: stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.stage.outputs.archive_name }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/npmguard" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/npmguard-mcp" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cd dist
          tar -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.stage.outputs.archive_name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/npmguard.exe" "dist/$name/"
          Copy-Item "target/${{ matrix.target }}/release/npmguard-mcp.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          Push-Location dist
          Compress-Archive -Path "$name" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Pop-Location

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.archive_name }}
          path: |
            dist/${{ steps.stage.outputs.archive_name }}.${{ matrix.archive }}
            dist/${{ steps.stage.outputs.archive_name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist/

      - name: combine checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
