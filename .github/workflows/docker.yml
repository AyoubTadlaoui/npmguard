name: docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or branch to build (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase repository names. Hardcoded lowercase rather than
  # depending on shell-level lowercasing of github.repository_owner.
  IMAGE_NAME: ayoubtadlaoui/npmguard-mcp

jobs:
  build-and-push:
    name: build & push ghcr.io/${{ github.repository_owner }}/npmguard-mcp
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # On tag push, build from the tag itself (it has the Dockerfile by
          # construction). On workflow_dispatch, build from main — needed
          # when retro-tagging an older release whose tag predates the
          # Dockerfile. The npmguard-mcp source at that tag is unchanged on
          # main since version bumps live in Cargo.toml only.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: extract version
        id: ver
        shell: bash
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          # Strip any leading "v" for the bare semver tag (e.g. 0.1.2),
          # but keep the v-prefixed tag too (e.g. v0.1.2). Both are pushed.
          semver="${ref#v}"
          echo "v_tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"

      - name: docker buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: docker login (ghcr)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.v_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
