[workspace]
resolver = "2"
members = [
    "crates/npmguard-cli",
    "crates/npmguard-risk",
    "crates/npmguard-cache",
    "crates/npmguard-mcp",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/AyoubTadlaoui/npmguard"
homepage = "https://github.com/AyoubTadlaoui/npmguard"
authors = ["Ayoub Tadlaoui"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "process", "sync", "time"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cache (SQLite, single file, bundled to avoid system libsqlite dependency)
rusqlite = { version = "0.32", features = ["bundled"] }

# Hashing / encoding
sha2 = "0.10"
hex = "0.4"

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Futures
futures = "0.3"

# Filesystem paths
directories = "5"

# MCP SDK
rmcp = { version = "0.2", features = ["server", "transport-io"] }
schemars = "0.8"

# Color output
owo-colors = { version = "4", features = ["supports-colors"] }

# Levenshtein for typosquat detection
strsim = "0.11"

# Workspace-internal crates
npmguard-risk = { path = "crates/npmguard-risk" }
npmguard-cache = { path = "crates/npmguard-cache" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
